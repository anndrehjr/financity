name: Segurança

# Varredura de segredos e dependências em todo pull request, em todo push na main e semanalmente.
# Permissões mínimas: só leitura do código. As ações são fixadas por SHA de commit.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos e dados pessoais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo: um segredo removido do código ainda existe em commits antigos
          persist-credentials: false

      - name: Verificador do projeto (arquivos versionados)
        run: node scripts/verificar-segredos.mjs --tudo

      - name: Verificador do projeto (histórico completo)
        run: node scripts/verificar-segredos.mjs --historico

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependencias:
    name: Vulnerabilidades de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Produção: qualquer vulnerabilidade alta ou crítica quebra a verificação.
      - name: npm audit (produção)
        run: npm audit --omit=dev --audit-level=high
      # Desenvolvimento: informativo (ferramentas de build não vão para produção); veja docs/security/REMEDIATION-PLAN.md.
      - name: npm audit (completo, informativo)
        run: npm audit --audit-level=critical || true
